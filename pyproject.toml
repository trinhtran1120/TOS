[project]
name = "tos"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Trinh Tran", email = "tr586225@ucf.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "cvxpy>=1.9.2",
    "jax==0.11.1",
    "jaxlib==0.11.1",
    "numpy==2.5.3",
    "osqp>=1.1.3",
    "scipy==1.18.1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
qp = ["configs.json", "checkpoints/*.npz"]

