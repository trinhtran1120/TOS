[project]
name = "tos"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Trinh Tran", email = "tr586225@ucf.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "cvxpy>=1.9.2",
    "cyipopt>=1.7.0",
    "jax==0.11.1",
    "jaxlib==0.11.1",
    "matplotlib==3.11.1",
    "numpy==2.5.3",
    "osqp>=1.1.3",
    "pandas==3.0.5",
    "pypower>=5.1.21",
    "qpth",
    "scipy==1.18.1",
    "setproctitle>=1.3.7",
    "torch>=2.14.0",
]

[project.scripts]
tos = "tos:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
qpth = { path = "vendor/qpth-0.0.15-py3-none-any.whl" }

